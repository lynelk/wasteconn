name: Verify

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies once
        run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
